<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>素材预览</title>
<style>
  body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .panel { padding: 28px 32px; }
  .light { background: #ffffff; color: #1f2328; }
  .dark  { background: #0d1117; color: #e6edf3; }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 16px; opacity: .7; letter-spacing: 1px; }
  .row { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 22px; }
  img { display: block; }
</style>
</head>
<body>
  <section class="panel light">
    <h2>LIGHT THEME</h2>
    <div class="row"><img src="assets/banner-light.svg" width="880" /></div>
    <div class="row">
      <img src="assets/terminal-light.svg" width="470" />
      <div>
        <div style="margin-bottom:12px"><img src="assets/status-building-light.svg" /></div>
        <div style="margin-bottom:12px"><img src="assets/status-shipped-light.svg" /></div>
        <div style="margin-bottom:12px"><img src="assets/status-learning-light.svg" /></div>
      </div>
    </div>
  </section>
  <section class="panel dark">
    <h2>DARK THEME</h2>
    <div class="row"><img src="assets/banner-dark.svg" width="880" /></div>
    <div class="row">
      <img src="assets/terminal-dark.svg" width="470" />
      <div>
        <div style="margin-bottom:12px"><img src="assets/status-building-dark.svg" /></div>
        <div style="margin-bottom:12px"><img src="assets/status-shipped-dark.svg" /></div>
        <div style="margin-bottom:12px"><img src="assets/status-learning-dark.svg" /></div>
      </div>
    </div>
  </section>
</body>
</html>
